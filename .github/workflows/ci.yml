name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  controles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests (hors réseau)
        run: python -m pytest -q
      - name: Contrôle du registre d'équations
        run: |
          python - <<'PY'
          from modele.registre import verifier_tout
          a = verifier_tout()
          if a:
              print("Registre non conforme :")
              for x in a: print("  -", x)
              raise SystemExit(1)
          print("Registre conforme.")
          PY
