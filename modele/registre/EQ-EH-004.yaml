# Alternative 3 — assiette en valeur ajoutée. Proposition, non arbitrée.
id: EQ-EH-004
nom: Dividende d'entreprise — alternative 3, assise sur la valeur ajoutée
description: >
  Même forme que l'alternative 1, mais l'assiette n'est plus le chiffre
  d'affaires : c'est la valeur ajoutée, c'est-à-dire ce que l'entreprise a
  réellement produit une fois retiré ce qu'elle a acheté à ses
  fournisseurs. Motif : la somme des chiffres d'affaires n'est pas une
  grandeur économique — elle compte plusieurs fois la même valeur. La
  somme des valeurs ajoutées, elle, vaut le PIB et ne bouge pas quand des
  entreprises fusionnent ou se scindent.

formule: "DENT = IED × VA × κ(s),  κ(s) = 2 / (1 + (s/s_ref)^γ),  s = salaire_max / DCIT"

variables:
  IED: {sens: "indicateur d'équilibre dynamique", unite: "sans dimension [0 ; 2]", source: "synthèse EH §8.2"}
  VA:  {sens: "valeur ajoutée brute de référence (production − consommations intermédiaires)", unite: "€/an", source: "Eurostat nasa_10_nf_tr, na_item B1G ; liasses fiscales au niveau entreprise"}
  s:   {sens: "plus haut salaire en multiples du revenu minimum", unite: "sans dimension", source: "déclarations sociales (DSN)"}

parametres:
  s_ref: {valeur: 5.0, intervalle: [2.0, 20.0], origine: design}
  gamma: {valeur: 2.0, intervalle: [1.0, 6.0], origine: design}

categorie: D
grade: D
empirique: false
couche: B

sources:
  - ref: "Ex Naturae (Albouy, Hairy, Lavilley), Vers une économie bio-intégrée — Synthèse, v1.7, oct. 2020, §11.1, p. 39"
    doi_ou_url: "https://exnaturae.ong/"
    ce_qu_elle_etablit: "Intention de conception : un dividende proportionnel à l'activité de l'entreprise, modulé par l'équité salariale"
  - ref: "Eurostat, Annual non-financial sector accounts (nasa_10_nf_tr), France, S11, P1 et B1G, 2023"
    doi_ou_url: "https://ec.europa.eu/eurostat/databrowser/view/nasa_10_nf_tr"
    ce_qu_elle_etablit: "Production des SNF 3 810 Md€ contre valeur ajoutée 1 481 Md€ : l'assiette est divisée par 2,57"
  - ref: "SEC 2010 (Système européen des comptes), §3.14 et §8.09 — additivité de la valeur ajoutée"
    doi_ou_url: "https://ec.europa.eu/eurostat/web/products-manuals-and-guidelines/-/ks-02-13-269"
    ce_qu_elle_etablit: "La valeur ajoutée est additive entre unités ; la production ne l'est pas (elle dépend du découpage des unités)"

sensibilite:
  balayage: ["s_ref de 2 à 20", "gamma de 1 à 6", "VA brute ou nette de la consommation de capital fixe", "périmètre SNF / SNF+SF / marchand"]
  impact_attendu: >
    Divise DTENT par environ 2,6 par rapport à toute variante assise sur la
    production. C'est la modification la plus lourde de conséquence sur la
    masse monétaire d'équilibre calculée pour la France.

limites: |
  - Abandonne explicitement la phrase de la synthèse « un dividende
    relativement proche du produit d'exploitation ». C'est assumé : cette
    phrase est précisément ce qui crée la faille de filialisation.
  - La valeur ajoutée d'une entreprise donnée est plus difficile à obtenir
    que son chiffre d'affaires, mais elle figure dans les liasses fiscales
    et dans le dispositif ESANE de l'INSEE. Disponibilité au niveau
    entreprise à confirmer. [À VÉRIFIER]
  - Brute ou nette de l'amortissement ? Choix non tranché ; l'écart est de
    l'ordre de 20 % de la VA brute en France. [À VÉRIFIER]
  - Comme l'alternative 1, ne récompense pas l'emploi à production égale.
    Peut se combiner avec la structure à deux termes de l'alternative 2.

statut: brouillon
maj: 2026-08-27
