# ⚠️ FICHE LA PLUS FRAGILE DU REGISTRE. Lire les limites avant l'usage.
id: EQ-EXEC-003
nom: IBD — indicateur de biodiversité (bouche-trou documenté)
description: >
  On voudrait mesurer l'état de la biodiversité française. On ne le peut
  pas : aucune série nationale d'état de la biodiversité, toutes espèces
  et tous milieux, n'existe en accès ouvert. On utilise donc l'indice des
  oiseaux communs des milieux agricoles — un seul taxon, un seul milieu —
  rapporté à son niveau de 1990.
  ⚠️ Ce n'est PAS une mesure de la biodiversité. C'est un bouche-trou
  explicite, publié pour montrer le trou, pas pour le combler.

formule: "IBD = mapping( indice_oiseaux(1990) / indice_oiseaux(année) )"

variables:
  indice_oiseaux: {sens: "indice des oiseaux communs des milieux agricoles, France", unite: "base 2000 = 100", source: "Eurostat env_bio2 (PECBMS / STOC)"}

parametres:
  annee_reference: {valeur: 1990, intervalle: [1990, 2000], origine: design}
  mapping:         {valeur: "exponentiel", intervalle: null, origine: design}

categorie: D
grade: D
empirique: false
couche: B

sources:
  - ref: "Ex Naturae, Synthèse v1.7, oct. 2020, §8.2"
    doi_ou_url: "https://exnaturae.ong/"
    ce_qu_elle_etablit: "Exige un indicateur de biodiversité valant 1 à l'équilibre et borné sur [0 ; 2]. N'en donne aucune formule et ne dit pas ce qu'est l'équilibre."
  - ref: "Eurostat, Common farmland bird index (env_bio2), France, 1990-2021"
    doi_ou_url: "https://ec.europa.eu/eurostat/databrowser/view/env_bio2"
    ce_qu_elle_etablit: "Seule série d'état de la biodiversité française disponible par API sur 30 ans. Recul de 93 à 54 entre 1990 et 2021, soit -42 %."
  - ref: "OCDE (2012), Perspectives de l'environnement de l'OCDE à l'horizon 2050, chapitre 4 — abondance moyenne des espèces (AMAE / MSA), modèle GLOBIO"
    doi_ou_url: "https://doi.org/10.1787/9789264122246-fr"
    ce_qu_elle_etablit: >
      Documente le bon référentiel : « une AMAE de 100 % correspond à l'absence de perturbation », c'est-à-dire un pourcentage de l'ÉTAT D'ORIGINE et non d'un état passé arbitraire. Chiffres extraits par script (StatLinks 888932594294 et 888932594256) : Europe terrestre 38,4 % en 2010 (projeté 29,3 % en 2050), monde 67,5 % ; biome « forêts tempérées », celui de la France, 49,7 % en 1970 puis 37,3 % en 2010. Ce dernier chiffre montre que dès 1970 le biome français avait déjà perdu la moitié de son abondance d'origine — donc que la référence 1990 de notre IBD est très en aval de l'équilibre.
      ⚠️ NE REMPLACE PAS LE BII : l'AMAE n'a pas de frontière planétaire chiffrée (le 90 % de Steffen et al. 2015 porte sur le BII), l'OCDE ne descend qu'à « Europe » et non à la France, et ce sont des PROJECTIONS de modèle sur quatre points (2010, 2020, 2030, 2050).
  - ref: "Alkemade, R. et al. (2009), GLOBIO3: A Framework to Investigate Options for Reducing Global Terrestrial Biodiversity Loss, Ecosystems 12"
    doi_ou_url: "https://doi.org/10.1007/s10021-009-9229-5"
    ce_qu_elle_etablit: "Modèle sous-jacent à l'AMAE utilisée par l'OCDE."
  - ref: "IPBES (2019), Global Assessment Report on Biodiversity and Ecosystem Services"
    doi_ou_url: "https://doi.org/10.5281/zenodo.3831673"
    ce_qu_elle_etablit: "Établit qu'aucun indicateur unique ne résume l'état de la biodiversité, et que les pressions dominantes (usage des sols, exploitation directe) s'exercent largement hors des frontières du pays consommateur."

sensibilite:
  balayage: ["seuil : état de 1990 (actuel) vs BII avec frontière planétaire à 90 %", "année de référence 1990 à 2000", "mapping linéaire / hyperbolique / exponentiel", "avec et sans IBD dans l'IED (colonne IED_sans_IBD publiée systématiquement)"]
  impact_attendu: >
    Le choix de l'année de référence déplace tout l'indicateur : prendre
    2000 au lieu de 1990 rendrait la France artificiellement meilleure.
    L'écart entre IED et IED_sans_IBD, publié dans toutes les sorties,
    mesure exactement ce que ce maillon faible fait au résultat : environ
    +0,15 sur l'IED des années 1990, quasi nul à partir de 2019.

limites: |
  ⚠️ DEUX LIMITES RÉDHIBITOIRES, à citer dans toute publication :

  1. AUCUNE DIMENSION IMPORTATIONS. La déforestation provoquée à
     l'étranger par la consommation française (soja, huile de palme,
     bois) n'y figure pas du tout. C'est pourtant l'exigence centrale de
     la synthèse (§14.1). L'IBD est le SEUL des trois indicateurs à
     violer cette exigence, et il la viole totalement.
  2. RÉFÉRENCE GLISSANTE. Prendre 1990 pour référence revient à décréter
     que la France de 1990 était à l'équilibre écologique. Elle ne
     l'était pas — le déclin des oiseaux agricoles avait déjà des
     décennies. L'IBD est donc structurellement TROP OPTIMISTE, d'un
     facteur inconnu et non estimable avec les données disponibles.

  Trois limites supplémentaires :
  3. UN TAXON, UN MILIEU. Rien sur les sols, les insectes, le milieu
     marin, les forêts, l'eau douce, ni l'outre-mer.
  4. RUPTURE DE SÉRIE EN 2000. La valeur publiée (100,0) est encadrée par
     69,5 et 72,7 : un bond de +40 % suivi d'une chute équivalente n'a
     aucun sens biologique. C'est un artefact de raccordement. L'année est
     retirée, et laisse un trou VISIBLE dans les sorties.
  5. SÉRIE ARRÊTÉE EN 2021.

  CONCLUSION HONNÊTE : les données ne suffisent pas à construire un IBD
  sérieux. Conformément à la RÈGLE N°3, on le dit plutôt que de combler
  au jugé. Trois issues sont ouvertes, aucune n'étant tranchée :
  approximation documentée (l'état actuel), paramètre libre balayé, ou
  retrait de l'IBD de l'IED (la colonne IED_sans_IBD existe pour cela).
  Voir docs/06-indicateurs-exec.md §4.

statut: brouillon
maj: 2026-08-27
